[[production]]
package = "ccusage"
bin = "ccusage"
reason = "the distributed CLI"

[[production]]
package = "ccusage-config"
bin = "generate-config-schema"
reason = "writes apps/ccusage/config-schema.json; the config-schema flake check runs it"

[[production]]
package = "ccusage-telemetry"
bin = "generate-telemetry-schema"
reason = "writes apps/telemetry/src/v1/ping-schema.gen.ts; the treefmt `telemetry-schema-gen` formatter runs it"
