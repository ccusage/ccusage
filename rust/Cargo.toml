[workspace]
members = ["adapters/*", "crates/*"]
resolver = "2"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
ccusage-adapter-all = { path = "crates/ccusage-adapter-all" }
ccusage-adapter-amp = { path = "adapters/amp" }
ccusage-adapter-antigravity = { path = "adapters/antigravity" }
ccusage-adapter-claude = { path = "adapters/claude" }
ccusage-adapter-cline = { path = "adapters/cline" }
ccusage-adapter-codebuff = { path = "adapters/codebuff" }
ccusage-adapter-codex = { path = "adapters/codex" }
ccusage-adapter-common = { path = "adapters/common" }
ccusage-adapter-copilot = { path = "adapters/copilot" }
ccusage-adapter-droid = { path = "adapters/droid" }
ccusage-adapter-dsh = { path = "adapters/dsh" }
ccusage-adapter-gemini = { path = "adapters/gemini" }
ccusage-adapter-goose = { path = "adapters/goose" }
ccusage-adapter-grok = { path = "adapters/grok" }
ccusage-adapter-hermes = { path = "adapters/hermes" }
ccusage-adapter-kilo = { path = "adapters/kilo" }
ccusage-adapter-kimi = { path = "adapters/kimi" }
ccusage-adapter-openclaw = { path = "adapters/openclaw" }
ccusage-adapter-opencode = { path = "adapters/opencode" }
ccusage-adapter-pi = { path = "adapters/pi" }
ccusage-adapter-qwen = { path = "adapters/qwen" }
ccusage-adapter-zcode = { path = "adapters/zcode" }
ccusage-cli = { path = "crates/ccusage-cli" }
ccusage-cli-parser = { path = "crates/ccusage-cli-parser" }
ccusage-config = { path = "crates/ccusage-config" }
ccusage-core = { path = "crates/ccusage-core" }
ccusage-environment = { path = "crates/ccusage-environment" }
ccusage-pricing-snapshots = { path = "crates/ccusage-pricing-snapshots" }
ccusage-terminal = { path = "crates/ccusage-terminal" }
ccusage-test-support = { path = "crates/ccusage-test-support", features = ["test-environment"] }
ccusage-zstd = { path = "crates/ccusage-zstd" }
assert_fs = "1.1.4"
compact_str = "0.10.0"
insta = { version = "1.49.0", features = ["json"] }
jiff = { version = "0.2.46", default-features = false, features = [
	"std",
	"tz-system",
	"tzdb-zoneinfo",
	"tzdb-bundle-platform",
] }
memchr = "2.8.3"
simdutf8 = "0.1.5"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
mimalloc = "0.1.52"
minreq = { version = "3.0.0", default-features = false, features = ["https-rustls"] }
percent-encoding = "2.3.2"
ring = { version = "0.17.14", default-features = false }
rustc-hash = "2.1.3"
rustix = { version = "1.1.6", features = ["process"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-webpki = { version = "0.103.17", default-features = false, features = ["ring"] }
schemars = "0.8"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = { version = "1.16.6", features = ["union"] }
sqlite = { version = "0.37.4", default-features = false, features = ["bundled", "linkage"] }
stats_alloc = "0.1.10"
terminal_size = "0.4.4"
toml = { version = "1.2.1", default-features = false, features = ["parse", "serde", "std"] }
unicode-width = "0.2.3"
ureq = { version = "3.5.2", default-features = false, features = [
	"gzip",
	"rustls-no-provider",
	"rustls-webpki-roots",
] }
zstd = { version = "0.14.4", default-features = false }
zstd-sys = { version = "2.1.3", default-features = false, features = ["experimental"] }

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

[profile.release.package.sqlite]
opt-level = "s"

[profile.release.package.sqlite3-src]
opt-level = "s"

[profile.release.package.sqlite3-sys]
opt-level = "s"

[workspace.lints.cargo]
unused_dependencies = "deny"
unused_workspace_dependencies = "deny"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
unfulfilled_lint_expectations = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
match_wildcard_for_single_variants = "deny"
mod_module_files = "deny"
clone_on_ref_ptr = "deny"
implicit_clone = "deny"
cast_lossless = "deny"
cast_possible_wrap = "deny"
float_cmp = "deny"
disallowed_methods = "deny"
wildcard_imports = "deny"
wildcard_enum_match_arm = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
