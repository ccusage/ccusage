[package]
name = "ccusage-adapter-common"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Tests only: the check that a source's focused report and its slice of the
# unified report count the same usage. Adapters enable it from
# [dev-dependencies], which Cargo leaves out of `cargo build`, so the shipped
# binary never compiles it.
testing = []
sqlite = ["dep:sqlite"]

[dependencies]
ccusage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
sqlite = { workspace = true, optional = true }

[dev-dependencies]
ccusage-test-support.workspace = true

[lints]
workspace = true
