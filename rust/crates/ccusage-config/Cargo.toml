[package]
name = "ccusage-config"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
ccusage-cli = { path = "../ccusage-cli" }
ccusage-core = { path = "../ccusage-core" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
ccusage-test-support = { path = "../ccusage-test-support" }
insta = { version = "1.47.2", features = ["json"] }
