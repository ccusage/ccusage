[package]
name = "ccusage-config"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Owning the generator here means building it compiles the config layer and its two
# dependencies rather than the binary's whole adapter graph.
[[bin]]
name = "generate-config-schema"
path = "src/bin/generate_config_schema.rs"

[dependencies]
ccusage-cli.workspace = true
ccusage-core.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
ccusage-test-support.workspace = true
insta.workspace = true
