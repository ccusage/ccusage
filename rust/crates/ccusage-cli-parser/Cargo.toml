[package]
name = "ccusage-cli-parser"
version = "0.0.0"
edition = "2024"
build = "build.rs"
publish = false

[dependencies]
ccusage-cli = { path = "../ccusage-cli" }

[build-dependencies]
serde_json = "1"

[dev-dependencies]
# The config-merge tests parse a command line against a config file, so they
# need the config layer and a filesystem fixture.
ccusage-config = { path = "../ccusage-config" }
ccusage-core = { path = "../ccusage-core" }
ccusage-test-support = { path = "../ccusage-test-support" }
insta = { version = "1.47.2", features = ["json"] }
serde_json = "1"
