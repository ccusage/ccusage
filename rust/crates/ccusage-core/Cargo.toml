[package]
name = "ccusage-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Tests only: `utc_now` returns the RFC 3339 instant in `CCUSAGE_TEST_NOW`
# when it is set, so tests of the binary can pin "now" for clock-relative
# reports. Crates enable it from [dev-dependencies], which Cargo leaves out of
# `cargo build`, so the Crane layers and the shipped binary never compile it,
# and diff-refs.bb enables it for the binaries it builds to replay the golden
# environment.
test-clock = []

[dependencies]
ccusage-cli.workspace = true
ccusage-terminal.workspace = true
jiff.workspace = true
memchr.workspace = true
miniz_oxide.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true

[dev-dependencies]
ccusage-pricing-snapshots.workspace = true
ccusage-test-support.workspace = true
insta.workspace = true

[lints]
workspace = true
