[package]
name = "ccusage-core"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Tests only: falls back to the snapshots in ccusage-pricing-snapshots when none
# were installed, so a test does not have to install them before loading
# pricing. Crates enable it from [dev-dependencies], which Cargo leaves out of
# `cargo build`, so the Crane layers and the shipped binary never compile it.
test-snapshots = ["dep:ccusage-pricing-snapshots"]

[dependencies]
ccusage-cli.workspace = true
ccusage-pricing-snapshots = { workspace = true, optional = true }
ccusage-terminal.workspace = true
jiff.workspace = true
memchr.workspace = true
miniz_oxide.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
smallvec.workspace = true

[dev-dependencies]
ccusage-pricing-snapshots.workspace = true
ccusage-test-support.workspace = true
insta.workspace = true
