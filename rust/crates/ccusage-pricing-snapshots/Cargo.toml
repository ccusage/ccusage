[package]
name = "ccusage-pricing-snapshots"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish.workspace = true

[features]
fetch-litellm-pricing = ["dep:minreq"]

[build-dependencies]
ccusage-core.workspace = true
ccusage-environment.workspace = true
miniz_oxide.workspace = true
minreq = { workspace = true, optional = true }
# NOTE(2026-11-20, #2399): The build script encodes the pricing table with the same float parsing the runtime applies to fetched pricing. Keep serde_json features equal to the runtime's; build.rs rejects a snapshot whose rates would shift.
serde_json.workspace = true

[dev-dependencies]
ccusage-core.workspace = true
serde_json.workspace = true

[lints]
workspace = true
