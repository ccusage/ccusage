[package]
name = "ccusage-pricing-snapshots"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish.workspace = true

[features]
fetch-litellm-pricing = ["dep:minreq"]

[build-dependencies]
ccusage-environment.workspace = true
miniz_oxide.workspace = true
minreq = { workspace = true, optional = true }
# NOTE(2026-08-15, #1541): serde_json default float parsing can shift prices by one ULP. Enable float_roundtrip so minification preserves pricing.
serde_json = { workspace = true, features = ["float_roundtrip"] }

[dev-dependencies]
ccusage-core.workspace = true
serde_json.workspace = true

[lints]
workspace = true
