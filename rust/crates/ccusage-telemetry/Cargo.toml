[package]
name = "ccusage-telemetry"
version.workspace = true
edition.workspace = true
publish.workspace = true

# Owning the generator here means building it compiles only this crate and its
# serialization dependencies, not the binary's adapter graph.
[[bin]]
name = "generate-telemetry-schema"
path = "src/bin/generate_telemetry_schema.rs"

[dependencies]
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
