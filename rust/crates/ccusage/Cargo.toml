[package]
name = "ccusage"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish.workspace = true

[[bin]]
name = "ccusage"
path = "src/main.rs"

[features]
fetch-litellm-pricing = ["ccusage-pricing-snapshots/fetch-litellm-pricing"]

[dependencies]
ccusage-adapter-all.workspace = true
ccusage-adapter-claude.workspace = true
ccusage-cli-parser.workspace = true
ccusage-cli.workspace = true
ccusage-config.workspace = true
ccusage-core.workspace = true
ccusage-pricing-snapshots.workspace = true
ccusage-report.workspace = true
ring.workspace = true
rustls.workspace = true
rustls-webpki.workspace = true
ureq.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
ccusage-core = { workspace = true, features = ["test-clock"] }
ccusage-test-support.workspace = true
insta.workspace = true
serde_json.workspace = true
sqlite.workspace = true
zstd.workspace = true

[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc.workspace = true

[lints]
workspace = true
