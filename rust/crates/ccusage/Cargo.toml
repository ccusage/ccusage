[package]
name = "ccusage"
version.workspace = true
edition.workspace = true
build = "build.rs"
publish.workspace = true

[[bin]]
name = "ccusage"
path = "src/main.rs"

[features]
# Enabled by the Windows release build, which cannot get the pricing snapshot
# from the pinned Nix input the way every other platform does.
fetch-litellm-pricing = ["ccusage-core/fetch-litellm-pricing"]

[dependencies]
ccusage-adapter-all.workspace = true
ccusage-adapter-amp.workspace = true
ccusage-adapter-claude.workspace = true
ccusage-adapter-codebuff.workspace = true
ccusage-adapter-codex.workspace = true
ccusage-adapter-common.workspace = true
ccusage-adapter-copilot.workspace = true
ccusage-adapter-droid.workspace = true
ccusage-adapter-gemini.workspace = true
ccusage-adapter-antigravity.workspace = true
ccusage-adapter-goose.workspace = true
ccusage-adapter-hermes.workspace = true
ccusage-adapter-kilo.workspace = true
ccusage-adapter-kimi.workspace = true
ccusage-adapter-openclaw.workspace = true
ccusage-adapter-opencode.workspace = true
ccusage-adapter-pi.workspace = true
ccusage-adapter-qwen.workspace = true
ccusage-cli-parser.workspace = true
ccusage-cli.workspace = true
ccusage-config.workspace = true
ccusage-core.workspace = true
serde.workspace = true
serde_json.workspace = true
ureq.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
ccusage-test-support.workspace = true

# mimalloc measurably beats the musl allocator on the static Linux build's
# allocation-heavy JSONL parsing.
[target.'cfg(all(target_os = "linux", target_env = "musl"))'.dependencies]
mimalloc.workspace = true
