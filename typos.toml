[default]
locale = 'en-us'
extend-ignore-re = [
	"(?s)(#|//)\\s*spellchecker:off.*?\\n\\s*(#|//)\\s*spellchecker:on",
	"(?s)<!--\\s*spellchecker:off.*?\\n\\s*spellchecker:on\\s*-->",
	"(?Rm)^.*#\\s*spellchecker:disable-line$",
	"(?m)^.*<!--\\s*spellchecker:disable-line\\s*-->\\n.*$",
]

[default.extend-words]
color = "color"
edn = "edn"
sade = "sade"

[files]
ignore-hidden = false
extend-exclude = [".git", "node_modules", "pnpm-lock.yaml", "pnpm-workspace.yaml"]

[type.gitleaks]
extend-glob = [".gitleaks.toml"]
extend-ignore-re = ["(?m)^[ \t]*'''[A-Za-z_]+=[A-Za-z0-9_-]+''',[ \t]*$"]
