packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@ryoppippi/vite-plugin-cloudflare-redirect': ^1.1.3
    cf: 1.0.0-rc.2
    vitepress: 2.0.0-alpha.21
    vitepress-plugin-group-icons: ^1.8.2
    vitepress-plugin-llms: ^1.15.0
  telemetry:
    '@tanstack/charts': ^1.5.0
    '@cloudflare/vite-plugin': 2.0.0-rc.2
    '@cloudflare/workers-types': ^5.20261018.1
    '@hono/zod-validator': ^0.9.1
    cf: 1.0.0-rc.2
    hono: ^4.13.13
    json-schema-to-ts: ^3.1.1
    vite: ^8.3.8
    zod: ^4.6.7
  types:
    '@types/node': ^26.6.6
    '@types/react': ^19.3.0

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@ryoppippi/vite-plugin-cloudflare-redirect'
  - vitepress
  - vitepress-plugin-group-icons
  - vitepress-plugin-llms

strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true

autoDedupe: true
