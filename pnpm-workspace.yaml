packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@ryoppippi/vite-plugin-cloudflare-redirect': ^1.1.3
    cf: 1.0.0-rc.2
    vitepress: 2.0.0-alpha.21
    vitepress-plugin-group-icons: ^1.8.2
    vitepress-plugin-llms: ^1.15.0
  types:
    '@types/node': ^26.6.6
    '@types/react': ^19.3.0

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@ryoppippi/vite-plugin-cloudflare-redirect'
  - vitepress
  - vitepress-plugin-group-icons
  - vitepress-plugin-llms

strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade

allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true

autoDedupe: true
