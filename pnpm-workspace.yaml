packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@ryoppippi/vite-plugin-cloudflare-redirect': ^1.1.3
    vitepress: 2.0.0-alpha.21
    vitepress-plugin-group-icons: ^1.8.2
    vitepress-plugin-llms: ^1.15.0
  types:
    '@types/node': ^26.6.6
    '@types/react': ^19.3.0
  lint:
    # Exact pins: oxlint 1.94.0 is the version evaluated with tsrs2, and the
    # two must stay paired. Renovate still proposes updates. Revisit once tsrs
    # goes stable.
    oxlint: 1.94.0
    # Exact pin: tsrs is still beta and revs every day or two. Revisit once it
    # goes stable. tsrs2 (not tsrs3) is pinned because the 48h minimumReleaseAge
    # policy above rejects anything published more recently.
    tsrs: 7.1.0-beta.tsrs2

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@ryoppippi/vite-plugin-cloudflare-redirect'
  - vitepress
  - vitepress-plugin-group-icons
  - vitepress-plugin-llms

# Security settings for supply chain attack prevention
strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade

# tsrs is a brand-new package name (first releases Nov 2026) from the Oxc team
# (publisher: boshen, repo: github.com/oxc-project/tsrs, provenance attested),
# which trips the no-downgrade heuristic. Pinned to the exact beta evaluated
# with Oxlint 1.94; drop this once tsrs goes stable. See issue #2201.
trustPolicyExclude:
  - tsrs@7.1.0-beta.tsrs2

# Explicitly allow build scripts for packages that require them
# (replaces onlyBuiltDependencies)
allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true

# Nix pins pnpm for local development and CI, so pnpm should not download a
# second package-manager binary or add its bootstrap metadata to the lockfile.
pmOnFail: ignore

# Collapse duplicate versions when one satisfies every range, so the lockfile
# does not accumulate redundant copies between manual `pnpm dedupe` runs.
# Requires pnpm 12.6+, pinned for Nix and package-manager installs.
autoDedupe: true
