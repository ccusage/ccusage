packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@ryoppippi/vite-plugin-cloudflare-redirect': ^1.1.3
    vitepress: 2.0.0-alpha.21
    vitepress-plugin-group-icons: ^1.8.2
    vitepress-plugin-llms: ^1.15.0
  types:
    '@types/node': ^26.6.6
    '@types/react': ^19.3.0
  lint:
    oxlint: ^1.94.0
    tsrs: 7.1.0-beta.tsrs3

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@ryoppippi/vite-plugin-cloudflare-redirect'
  - vitepress
  - vitepress-plugin-group-icons
  - vitepress-plugin-llms
  # tsrs publishes beta tags that minimumReleaseAge would otherwise hold back
  # for 48h, leaving type-aware lint without a backend after an update.
  - tsrs
  - '@tsrs/*'

# Security settings for supply chain attack prevention
strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade
# pnpm flags tsrs as a possible takeover because the name predates oxc's port
# (created 2023, snapshot versions from 2024). The 7.x betas are the official
# backend from https://github.com/oxc-project/tsrs: SLSA provenance resolves
# to oxc-project/tsrs and the maintainer matches oxlint/oxlint-tsgolint.
# Keep this pinned per version so each tsrs update re-triggers the check.
trustPolicyExclude:
  - tsrs@7.1.0-beta.tsrs3

# Explicitly allow build scripts for packages that require them
# (replaces onlyBuiltDependencies)
allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true

# Nix pins pnpm for local development and CI, so pnpm should not download a
# second package-manager binary or add its bootstrap metadata to the lockfile.
pmOnFail: ignore

# Collapse duplicate versions when one satisfies every range, so the lockfile
# does not accumulate redundant copies between manual `pnpm dedupe` runs.
# Requires pnpm 12.6+, pinned for Nix and package-manager installs.
autoDedupe: true
