packages:
  - apps/*
  - docs
  - packages/*

catalogMode: strict

catalogs:
  docs:
    '@ryoppippi/vite-plugin-cloudflare-redirect': ^1.1.3
    vitepress: 2.0.0-alpha.18
    vitepress-plugin-group-icons: ^1.7.6
    vitepress-plugin-llms: ^1.13.4
  types:
    '@types/node': ^24.13.3
    '@types/react': ^19.2.18

enablePrePostScripts: true

minimumReleaseAge: 2880
minimumReleaseAgeExclude:
  - '@ryoppippi/vite-plugin-cloudflare-redirect'
  - vitepress
  - vitepress-plugin-group-icons
  - vitepress-plugin-llms

# Security settings for supply chain attack prevention
strictDepBuilds: true
blockExoticSubdeps: true

trustPolicy: no-downgrade

# Explicitly allow build scripts for packages that require them
# (replaces onlyBuiltDependencies)
allowBuilds:
  esbuild: true
  sharp: true
  sqlite3: true
  workerd: true

shellEmulator: true
