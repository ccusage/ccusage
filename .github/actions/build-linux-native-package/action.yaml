name: Build Linux native package
description: Build, stage, archive, and upload a Linux ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
  cache-scope:
    description: >
      Unique matrix-entry identifier (the matrix `name`) used to scope the Nix
      cache so the arm64 and x64 legs do not share one key.
    required: true
  save-nix-cache:
    description: Whether this job may persist the Nix store; forwarded to setup-nix-cache as `save`.
    default: 'true'
  telemetry-enabled:
    description: Whether this official release build should report usage.
    default: 'false'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-nix-cache
      with:
        cache-scope: ${{ inputs.cache-scope }}
        save: ${{ inputs.save-nix-cache }}

    - name: Build Linux static binary and check its target under the unsafe_code forbid
      id: build
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        TELEMETRY_ENABLED: ${{ inputs.telemetry-enabled }}
      run: |
        package="ccusage-release-linux-$ARCH"
        if [ "$TELEMETRY_ENABLED" = "true" ]; then
          package="$package-telemetry"
        fi
        echo "package=$package" >> "$GITHUB_OUTPUT"
        nix build ".#$package" ".#$package.passthru.unsafeCodeCheck"

    - name: Root current Crane artifacts for cache save
      if: inputs.save-nix-cache == 'true'
      shell: bash
      env:
        PACKAGE: ${{ steps.build.outputs.package }}
      run: |
        system="$(nix eval --impure --raw --expr builtins.currentSystem)"
        user_gcroot="/nix/var/nix/gcroots/per-user/$(id -un)/ci"
        mkdir -p "$user_gcroot"
        nix build ".#packages.$system.$PACKAGE.passthru.cacheRoot" \
          --out-link "$user_gcroot/ccusage-cargo-artifacts"

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: apps/ccusage/scripts/stage-native-package.nu --platform linux --arch "$ARCH" --binary "$BINARY"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-linux-$ARCH.tar" "packages/ccusage-linux-$ARCH/bin"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccusage-native-linux-${{ inputs.arch }}
        path: ccusage-native-linux-${{ inputs.arch }}.tar
        if-no-files-found: error
