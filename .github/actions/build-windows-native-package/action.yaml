name: Build Windows native package
description: Build, stage, archive, and upload a Windows ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
  save-cargo-cache:
    description: >
      Whether this job may persist the Cargo cache. Saves additionally require a
      run on main outside pull requests and a dependency key with no entry yet,
      so pull request code never writes a cache that main and releases read.
    default: 'true'
  telemetry-enabled:
    description: Whether this official release build should report usage.
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found"
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --no-self-update
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - name: Restore Cargo cache
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          rust/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-

    - name: Configure telemetry for official release
      if: inputs.telemetry-enabled == 'true'
      shell: bash
      run: echo 'CCUSAGE_TELEMETRY_ENDPOINT=https://telemetry.ccusage.com/v1/ping' >> "$GITHUB_ENV"

    - name: Build Cargo native binary
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

    - name: Check Windows under the unsafe_code forbid
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      run: |
        wrapper="$RUNNER_TEMP/forbid-unsafe-rustc.exe"
        rustc --edition 2024 -O scripts/forbid-unsafe-rustc.rs -o "$wrapper"
        RUSTC_WORKSPACE_WRAPPER="$wrapper" cargo check \
          --manifest-path rust/Cargo.toml \
          --workspace \
          --all-targets \
          --all-features \
          --locked \
          --target-dir "$RUNNER_TEMP/unsafe-code"

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: |
        mkdir -p "packages/ccusage-win32-$ARCH/bin"
        cp "$BINARY" "packages/ccusage-win32-$ARCH/bin/ccusage.exe"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-win32-$ARCH.tar" "packages/ccusage-win32-$ARCH/bin"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccusage-native-win32-${{ inputs.arch }}
        path: ccusage-native-win32-${{ inputs.arch }}.tar
        if-no-files-found: error

    - name: Drop workspace outputs from the Cargo cache
      id: cargo-cache-prune
      if: >-
        inputs.save-cargo-cache == 'true'
        && steps.cargo-cache.outputs.cache-hit != 'true'
        && github.ref == 'refs/heads/main'
        && github.event_name != 'pull_request'
        && github.event_name != 'pull_request_target'
      shell: bash
      run: |
        cd rust/target/release
        rm -rf ccusage* deps/*ccusage* .fingerprint/ccusage* build/ccusage*

    - name: Save Cargo cache
      if: steps.cargo-cache-prune.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          rust/target
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
