name: Build Windows native package
description: Build, stage, archive, and upload a Windows ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: >
      Ignored. The build output lives under CARGO_TARGET_DIR on the Dev Drive,
      so the binary is staged from there; the input remains only so callers
      that still pass it keep working.
    required: false
  save-cargo-cache:
    description: >
      Whether this job may persist the Cargo cache. Saves additionally require a
      run on main outside pull requests and a dependency key with no entry yet,
      so pull request code never writes a cache that main and releases read.
    default: 'true'
runs:
  using: composite
  steps:
    # Defender scans every file written to the system volume, which makes the
    # many small files of the toolchain, the cache extraction, and the build
    # output the slowest part of this job. A Dev Drive (ReFS with Defender in
    # performance mode, or a VHDX fallback) avoids that cost, so CARGO_HOME,
    # RUSTUP_HOME, and the target directory all live on it. Forward slashes keep
    # the values valid for both bash and cargo.
    - name: Set up Dev Drive
      uses: samypr100/setup-dev-drive@562171fe8df7401fdf582d766cd3b6ab80d5b1a0 # v4.1.0
      with:
        drive-size: 12GB
        drive-format: ReFS
        env-mapping: |
          CARGO_HOME,{{ DEV_DRIVE }}/.cargo
          RUSTUP_HOME,{{ DEV_DRIVE }}/.rustup
          CARGO_TARGET_DIR,{{ DEV_DRIVE }}/target

    # rust-toolchain.toml also lists clippy, rustfmt, and llvm-tools for local
    # development, which rustup would otherwise download on the first cargo call
    # (~50 MB of the ~150 MB of xz archives). The release build only needs the
    # minimal profile of the same channel; RUSTUP_TOOLCHAIN takes precedence
    # over the toolchain file, so cargo does not install the rest.
    - name: Install Rust toolchain
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found"
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --no-self-update
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    # Keyed on everything that decides the dependency build (toolchain, Cargo
    # config, lockfile, and manifests) rather than the commit: workspace crates
    # recompile on every run anyway because checkout gives their sources fresh
    # mtimes, so only dependency changes make a new entry worth saving.
    - name: Restore Cargo cache
      id: cargo-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_TARGET_DIR }}
        key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', '.cargo/config.toml', 'rust/Cargo.lock', 'rust/**/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-

    - name: Build Cargo native binary
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      # Nix cannot target Windows, so this is the one build that downloads the
      # LiteLLM pricing snapshot instead of reading it from the pinned input.
      run: cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: |
        mkdir -p "packages/ccusage-win32-$ARCH/bin"
        cp "$CARGO_TARGET_DIR/release/ccusage.exe" "packages/ccusage-win32-$ARCH/bin/ccusage.exe"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-win32-$ARCH.tar" "packages/ccusage-win32-$ARCH/bin"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccusage-native-win32-${{ inputs.arch }}
        path: ccusage-native-win32-${{ inputs.arch }}.tar
        if-no-files-found: error

    # Workspace crates rebuild on every run (see the restore step), so their
    # outputs, about a quarter of the target directory, would only slow every
    # restore. Every workspace crate name starts with ccusage and no
    # dependency's does.
    - name: Drop workspace outputs from the Cargo cache
      id: cargo-cache-prune
      if: >-
        inputs.save-cargo-cache == 'true'
        && steps.cargo-cache.outputs.cache-hit != 'true'
        && github.ref == 'refs/heads/main'
        && github.event_name != 'pull_request'
        && github.event_name != 'pull_request_target'
      shell: bash
      run: |
        cd "$CARGO_TARGET_DIR/release"
        rm -rf ccusage* deps/*ccusage* .fingerprint/ccusage* build/ccusage*

    - name: Save Cargo cache
      if: steps.cargo-cache-prune.outcome == 'success'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ${{ env.CARGO_HOME }}/registry
          ${{ env.CARGO_TARGET_DIR }}
        key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
