name: Build Windows native package
description: Build, stage, archive, and upload a Windows ccusage native package
inputs:
  arch:
    description: Native package architecture
    required: true
  binary:
    description: Path to the built ccusage binary
    required: true
runs:
  using: composite
  steps:
    # rust-toolchain.toml also lists clippy, rustfmt, and llvm-tools for local
    # development, which rustup would otherwise download on the first cargo call
    # (~50 MB of the ~150 MB of xz archives). The release build only needs the
    # minimal profile of the same channel; RUSTUP_TOOLCHAIN takes precedence
    # over the toolchain file, so cargo does not install the rest.
    - name: Install Rust toolchain
      id: toolchain
      shell: bash
      run: |
        channel="$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' rust-toolchain.toml)"
        if [ -z "$channel" ]; then
          echo "::error file=rust-toolchain.toml::no channel found"
          exit 1
        fi
        rustup toolchain install "$channel" --profile minimal --no-self-update
        echo "channel=$channel" >> "$GITHUB_OUTPUT"

    - uses: ./.github/actions/setup-native-build-cache
      with:
        platform: win32

    - name: Build Cargo native binary
      shell: bash
      env:
        RUSTUP_TOOLCHAIN: ${{ steps.toolchain.outputs.channel }}
      # Nix cannot target Windows, so this is the one build that downloads the
      # LiteLLM pricing snapshot instead of reading it from the pinned input.
      run: cargo build --manifest-path rust/Cargo.toml --release --bin ccusage --features fetch-litellm-pricing

    - name: Stage native package
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
        BINARY: ${{ inputs.binary }}
      run: |
        mkdir -p "packages/ccusage-win32-$ARCH/bin"
        cp "$BINARY" "packages/ccusage-win32-$ARCH/bin/ccusage.exe"

    - name: Archive native package binary
      shell: bash
      env:
        ARCH: ${{ inputs.arch }}
      run: tar -cf "ccusage-native-win32-$ARCH.tar" "packages/ccusage-win32-$ARCH/bin"

    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ccusage-native-win32-${{ inputs.arch }}
        path: ccusage-native-win32-${{ inputs.arch }}.tar
        if-no-files-found: error
