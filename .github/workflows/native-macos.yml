name: Native macOS QA

on:
  workflow_dispatch:
  push:
    branches: [feat/ccusage-macos-native, feat/reference-usage-visual-overhaul, feat/reference-usage-pixel-polish]

permissions:
  contents: write

jobs:
  build-and-qa:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Native SDK
        run: npm install -g @native-sdk/cli@latest
      - name: Validate app
        run: native check --strict
      - name: Build release with automation
        run: native build --yes -Dautomation=true
      - name: Force dark appearance for reference QA
        run: |
          defaults write -g AppleInterfaceStyle -string Dark
          killall cfprefsd || true
      - name: Launch for deterministic UI QA
        run: |
          native dev -Dautomation=true > /tmp/ccusage-native.log 2>&1 &
          echo $! > /tmp/native.pid
          sleep 8
          native automate wait
          native automate snapshot > native-snapshot.txt
          native automate assert 'gpu_nonblank=true'
          native automate screenshot main-canvas 2
          cp .zig-cache/native-sdk-automation/screenshot-main-canvas.png screenshot-main-canvas.png
          kill $(cat /tmp/native.pid) || true
      - name: Preserve dev log
        if: always()
        run: cp /tmp/ccusage-native.log native-dev.log || true
      - name: Publish QA evidence
        if: success()
        run: |
          mkdir -p qa
          cp screenshot-main-canvas.png qa/screenshot-main-canvas.png
          cp native-snapshot.txt qa/native-snapshot.txt
          cp native-dev.log qa/native-dev.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish native QA evidence [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - name: Export text-safe screenshot preview
        if: success()
        run: |
          sips -Z 1000 screenshot-main-canvas.png --out screenshot-preview.jpg >/dev/null
          base64 -i screenshot-preview.jpg | tr -d '\n' > screenshot-preview.b64
          mkdir -p qa/preview-b64
          rm -f qa/preview-b64/part-*
          split -b 50000 -a 3 screenshot-preview.b64 qa/preview-b64/part-
          git add qa/preview-b64
          if ! git diff --cached --quiet; then
            git commit -m "chore: publish text-safe screenshot preview [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ccusage-native-qa
          path: |
            screenshot-main-canvas.png
            screenshot-preview.jpg
            native-snapshot.txt
            native-dev.log
            zig-out/**
          if-no-files-found: error
