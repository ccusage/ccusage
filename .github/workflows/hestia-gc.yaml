name: Hestia cache GC

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gc:
    permissions:
      actions: write
      contents: read
    uses: x-ryoppippi/setup-nix/.github/workflows/gc.yaml@2b47573374b517ae165cba29a8cb83e20d9102dc # v0.0.9
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
