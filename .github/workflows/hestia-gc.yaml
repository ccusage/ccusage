name: Hestia cache GC

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gc:
    permissions:
      actions: write
      contents: read
    uses: x-ryoppippi/setup-nix/.github/workflows/gc.yaml@7e74b323c73835866702959671962c581f289cc0 # v0.0.6
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
