name: Hestia cache GC

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Plan only; do not repack, touch, or delete anything.
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  gc:
    permissions:
      actions: write
      contents: read
    uses: x-ryoppippi/setup-nix/.github/workflows/gc.yaml@23ff4e6022b629334d3d16aa3b33b52fb6a3f37b # v0.0.5
    with:
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
