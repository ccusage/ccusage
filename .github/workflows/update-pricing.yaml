name: update pricing

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: update-pricing
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  update-pricing:
    name: ${{ matrix.name }}
    if: >-
      github.event_name != 'push' ||
      !startsWith(github.event.head_commit.message, 'chore: release v')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - name: litellm
            script: .github/scripts/update-litellm-lock.nu
            message: 'chore(pricing): update LiteLLM snapshot'
          - name: models-dev
            script: .github/scripts/update-models-dev-lock.nu
            message: 'chore(pricing): update models.dev snapshot'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
        with:
          cache-scope: ${{ matrix.name }}
      - name: Update pricing input
        id: update
        env:
          SCRIPT: ${{ matrix.script }}
        run: |
          $SCRIPT | jq -r '"changed=\(.changed)", "paths=\(.paths | join(" "))"' >> "$GITHUB_OUTPUT"
      - name: Validate changed pricing
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check
          nix profile install --inputs-from . .#pnpm nixpkgs#nodejs nixpkgs#just nixpkgs#bun
          just install
          just test-node
          just ccusage::test-performance-harness
          just ccusage::test-diff-refs
      - uses: ./.github/actions/commit-and-push-main
        if: steps.update.outputs.changed == 'true'
        with:
          message: ${{ matrix.message }}
          paths: ${{ steps.update.outputs.paths }}
