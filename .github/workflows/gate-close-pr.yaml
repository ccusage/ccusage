name: Gate Close PR

# Manually close a PR when a maintainer explicitly requests it.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to close
        required: true
        type: number

jobs:
  close:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Close PR with the maintainer-requested message
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prNumber = Number(context.payload.inputs.pr_number);
            const defaultBranch = context.payload.repository.default_branch;

            const message = [
              'This PR was closed by a maintainer-run contribution gate.',
              '',
              `Maintainers review contribution-gate decisions against the quality bar in [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md).`,
              '',
              'If a maintainer replies `lgtmi`, future issues will bypass the gate. If a maintainer replies `lgtm`, future issues and PRs will bypass the gate.',
              '',
              `See [CONTRIBUTING.md](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/${defaultBranch}/CONTRIBUTING.md).`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: message,
            });

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
              state: 'closed',
            });
