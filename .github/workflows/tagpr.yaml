name: tagpr

on:
  push:
    branches:
      - main

concurrency: tagpr

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
      actions: write
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # postVersionCommand in .tagpr runs `nix develop`, so the Nix store cache must be ready
      - uses: ./.github/actions/setup-nix-cache
      - id: tagpr
        uses: Songmu/tagpr@e84001bd5dac8defa0c75b3913937d284a3b3660 # v1.20.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Tags pushed with GITHUB_TOKEN do not trigger `on: push: tags` workflows,
      # so dispatch release.yaml explicitly (workflow_dispatch is exempt from that rule)
      - name: Trigger release workflow
        if: steps.tagpr.outputs.tag != ''
        run: gh workflow run release.yaml --ref "$TAG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tagpr.outputs.tag }}
