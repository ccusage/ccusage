name: tagpr

on:
  push:
    branches:
      - main

concurrency: tagpr

jobs:
  tagpr:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # tagpr's documented least-privilege scopes; the release dispatch that needs
    # `actions: write` is isolated in the dependent dispatch-release job below.
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      # postVersionCommand in .tagpr runs `nix develop`, so the Nix store cache must be ready
      - uses: ./.github/actions/setup-nix-cache
      - id: tagpr
        uses: Songmu/tagpr@e84001bd5dac8defa0c75b3913937d284a3b3660 # v1.20.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Tags pushed with GITHUB_TOKEN do not trigger `on: push: tags` workflows,
  # so dispatch release.yaml explicitly (workflow_dispatch is exempt from that rule).
  # Isolated in its own job so only it needs `actions: write`.
  dispatch-release:
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Trigger release workflow
        run: gh workflow run release.yaml --ref "$TAG" --repo "$REPO"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.tagpr.outputs.tag }}
          REPO: ${{ github.repository }}
