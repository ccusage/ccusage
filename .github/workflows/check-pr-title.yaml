name: Check PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  merge_group:
    types: [checks_requested]

permissions:
  pull-requests: read

env:
  TITLE_EXEMPT_LABELS: |
    autorelease: pending
    dependencies

defaults:
  run:
    shell: bash

jobs:
  main:
    name: Validate PR title
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@c5e23b7e584519ee15caa684cf60d056aa9f035f # v6.1.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: ${{ env.TITLE_EXEMPT_LABELS }}

  scope:
    name: Validate PR title scope
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            flake.lock
            flake.nix
            scripts
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-nix-cache
      - name: Check title scope against the changed adapters
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/validate-commit-scope.nu pr
