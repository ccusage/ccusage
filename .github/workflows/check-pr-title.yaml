name: Check PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  # Both jobs are required checks, so they also pass, without validating, on
  # merge groups, whose pull requests were already judged.
  merge_group:
    types: [checks_requested]
  # release.yaml dispatches this for tagpr's release PR, whose pull_request runs
  # wait for an approval, and a person pushing to that branch starts it through
  # `push`; see release-pr-statuses.
  workflow_dispatch:
  push:
    branches: ['tagpr-from-*']

permissions:
  pull-requests: read

env:
  TITLE_EXEMPT_LABELS: |
    autorelease: pending
    dependencies

defaults:
  run:
    shell: bash

jobs:
  main:
    name: Validate PR title
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-slim
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: ${{ env.TITLE_EXEMPT_LABELS }}

  # The job above only checks the title's shape. A squash merge turns that title
  # into the subject on main, so it also has to survive the scope rules
  # scripts/validate-commit-scope.nu applies to local commits.
  scope:
    name: Validate PR title scope
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/actions
            scripts
      - if: github.event_name == 'pull_request'
        uses: ./.github/actions/setup-nu
      - name: Check title scope against the changed adapters
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nu scripts/validate-commit-scope.nu pr

  # Check runs from a dispatch are not attached to the release PR, so they cannot
  # satisfy main's required title checks. Commit statuses on the same SHA are, so
  # this posts both contexts. The release PR's title comes from
  # .github/tagpr-template.md, so there is nothing to validate; the statuses are
  # posted only when this SHA is the head of an open PR that tagpr opened from
  # this branch.
  release-pr-statuses:
    name: Release PR title statuses
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      pull-requests: read
      statuses: write
    steps:
      - name: Post title check statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != tagpr-from-* ]]; then
            echo "::error::Only tagpr release branches get title statuses."
            exit 1
          fi
          release_prs="$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
            -f state=open -f head="$GITHUB_REPOSITORY_OWNER:$REF_NAME" --method GET \
            --jq "[.[] | select(.head.sha == \"$GITHUB_SHA\" and .user.login == \"github-actions[bot]\")] | length")"
          if [ "$release_prs" -eq 0 ]; then
            echo "::error::${GITHUB_SHA} is not the head of an open tagpr release PR from ${REF_NAME}."
            exit 1
          fi
          for context in 'Validate PR title' 'Validate PR title scope'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f context="$context" \
              -f description='Release PR title comes from the tagpr template' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
