name: Check PR title

on:
  pull_request:
    types:
      - opened
      - reopened
      - edited
      - synchronize
  # Both jobs are required checks, so they also pass, without validating, on
  # merge groups, whose pull requests were already judged.
  merge_group:
    types: [checks_requested]
  # release.yaml dispatches this for tagpr's release PR, whose pull_request runs
  # wait for an approval; see release-pr-statuses.
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  main:
    name: Validate PR title
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-slim
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          ignoreLabels: |
            autorelease: pending
            dependencies

  # The job above only checks the title's shape. A squash merge turns that title
  # into the subject on main, so it also has to survive the scope rules
  # scripts/validate-commit-scope.nu applies to local commits — keep the two in
  # step.
  scope:
    name: Validate PR title scope
    runs-on: ubuntu-slim
    timeout-minutes: 5
    # Same exemptions as the job above, so the two title policies agree on which
    # pull requests they judge.
    if: >-
      github.event_name == 'merge_group' || (
        github.event_name == 'pull_request'
        && !contains(github.event.pull_request.labels.*.name, 'autorelease: pending')
        && !contains(github.event.pull_request.labels.*.name, 'dependencies')
      )
    steps:
      - name: Skip on merge groups
        if: github.event_name == 'merge_group'
        run: echo 'Merge groups are built from pull requests whose titles already passed.'
      - if: github.event_name == 'pull_request'
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c # v3.29
        with:
          # Matches the dev shell in flake.nix, so a title rejected here is
          # rejected the same way by the commit-msg hook.
          version: 0.114.1

      - name: Check title scope against the changed adapters
        if: github.event_name == 'pull_request'
        shell: nu {0}
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        # This job only calls GitHub APIs, so keeping the script inline avoids a repository clone.
        run: |
          # Mirrors scripts/validate-commit-scope.nu; the two move together.
          const CROSS_CUTTING_SCOPES = [deps, release, pricing, revert]
          const WORKSPACE_SCOPES = [adapter, all, rust]
          const GENERATED_SUBJECTS = ["Merge ", "Revert ", "fixup!", "squash!", "amend!"]

          def main []: nothing -> nothing {
            let title = $env.PR_TITLE | str trim

            if ($GENERATED_SUBJECTS | any {|prefix| $title | str starts-with $prefix }) { return }

            let parsed = $title | parse --regex '^(?<type>[a-z]+)(?:\((?<scope>[^()]+)\))?!?: \S' | get 0?
            if $parsed == null {
              reject $title "is not a Conventional Commit" "Use `<type>(<scope>): <subject>`, for example `feat(codex): add session totals`."
            }

            let owners = changed-owners
            let scopes = $parsed.scope
              | default ""
              | split row ","
              | each {|scope| $scope | str trim }
              | where {|scope| $scope != "" }

            match $owners {
              [] => {}
              [$owner] => {
                (check $title $scopes ($CROSS_CUTTING_SCOPES | prepend $owner)
                  $"The change belongs to `($owner)`, so use `($parsed.type)\(($owner)\): ...`.")
              }
              [_, _, ..] => {
                (check $title $scopes ($CROSS_CUTTING_SCOPES | append $WORKSPACE_SCOPES | append $owners)
                  $"The change spans ($owners | str join ', '), so name one of them or use a scope that covers all of them.")
              }
            }
          }

          # Rejects a title whose scope is missing from `allowed`.
          def check [title: string, scopes: list<string>, allowed: list<string>, hint: string]: nothing -> nothing {
            if ($scopes | is-empty) {
              reject $title "needs a scope" $hint
            }

            if not ($scopes | all {|scope| $scope in $allowed }) {
              reject $title $"is scoped `($scopes | str join ',')`" $hint
            }
          }

          def reject [title: string, problem: string, hint: string]: nothing -> nothing {
            print --stderr $"PR title ($problem):\n  ($title)\n\n($hint)"
            exit 1
          }

          # Lists the agents owning the files this pull request touches. Only
          # rust/adapters/* is mapped: each crate is a catch-all whose commits are
          # scoped by feature rather than by crate name.
          def changed-owners []: nothing -> list<string> {
            gh api $"repos/($env.GITHUB_REPOSITORY)/pulls/($env.PR_NUMBER)/files" --paginate --slurp
            | from json
            | flatten
            | get filename
            | each {|path| owner-for-path $path }
            | compact
            | uniq
            | sort
          }

          def owner-for-path [path: string]: nothing -> any {
            match ($path | split row "/") {
              ["rust", "adapters", "common", ..] => "adapter"
              # A dot means the entry is a file directly under `adapters/`, not an agent.
              ["rust", "adapters", $agent, ..] if not ($agent | str contains ".") => $agent
              _ => null
            }
          }

  # Check runs from a dispatch are not attached to the release PR, so they cannot
  # satisfy main's required title checks. Commit statuses on the same SHA are, so
  # this posts both contexts. The release PR's title comes from
  # .github/tagpr-template.md, so there is nothing to validate.
  release-pr-statuses:
    name: Release PR title statuses
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post title check statuses
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" != tagpr-from-* ]]; then
            echo "::error::Only tagpr release branches get title statuses on dispatch."
            exit 1
          fi
          for context in 'Validate PR title' 'Validate PR title scope'; do
            gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
              -f state=success \
              -f context="$context" \
              -f description='Release PR title comes from the tagpr template' \
              -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
