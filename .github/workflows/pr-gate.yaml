name: PR Gate

on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: read
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  check-contributor:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write
    outputs:
      access_outcome: ${{ steps.access.outcome }}
      skip: ${{ steps.access.outputs.skip }}
      bypass: ${{ steps.access.outputs.bypass }}
      close_allowed: ${{ steps.access.outputs.close_allowed }}
      judge_outcome: ${{ steps.judge.outcome }}
      result: ${{ steps.judge.outputs.result }}
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix-cache

      - name: Check PR author
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: .github/scripts/contribution-gate.nu pr-access

      - name: Prepare the Pullfrog request
        id: request
        if: >-
          steps.access.outcome == 'success' &&
          steps.access.outputs.skip != 'true' &&
          steps.access.outputs.bypass != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/contribution-gate.nu pr-request

      - name: Ask Luna for a PR verdict
        id: judge
        if: >-
          steps.access.outcome == 'success' &&
          steps.access.outputs.skip != 'true' &&
          steps.access.outputs.bypass != 'true'
        continue-on-error: true
        uses: pullfrog/pullfrog@297233107454120a5d2e9926b20fdc15d234dca6 # v0.1.146
        with:
          prompt: ${{ steps.request.outputs.prompt }}
          timeout: 15m
          push: disabled
          shell: disabled
          progress_comments: disabled
          output_schema: ${{ steps.request.outputs.schema }}
        env:
          GH_TOKEN: ${{ github.token }}

  apply:
    needs: check-contributor
    if: >-
      always() &&
      needs.check-contributor.result != 'cancelled' &&
      needs.check-contributor.outputs.access_outcome == 'success' &&
      needs.check-contributor.outputs.skip != 'true' &&
      needs.check-contributor.outputs.bypass != 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix-cache

      - name: Apply the PR verdict
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          CLOSE_ALLOWED: ${{ needs.check-contributor.outputs.close_allowed }}
          JUDGE_OUTCOME: ${{ needs.check-contributor.outputs.judge_outcome }}
          RESULT: ${{ needs.check-contributor.outputs.result }}
        run: .github/scripts/contribution-gate.nu pr-verdict
