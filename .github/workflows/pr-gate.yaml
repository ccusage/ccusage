name: PR Gate

# Use pull_request_target so outside-contributor PRs receive the base
# repository's write permissions. This workflow checks out only the base branch
# and gives Pullfrog the PR diff as data; it never executes code from the PR.
on:
  pull_request_target:
    types:
      - opened

permissions:
  contents: read
  issues: write
  pull-requests: write
  id-token: write

jobs:
  check-contributor:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout the base repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Nushell
        uses: hustcer/setup-nu@9215c80adb545a85c419d5085b76eb6d082f49e7 # v3.27
        with:
          version: 0.114.1

      - name: Check PR author
        id: access
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: nu .github/scripts/contribution-gate.nu pr-access

      - name: Prepare the Pullfrog request
        id: request
        if: steps.access.outcome == 'success' && steps.access.outputs.bypass != 'true'
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
        run: nu .github/scripts/contribution-gate.nu pr-request

      - name: Ask Luna for a PR verdict
        id: judge
        if: steps.access.outcome == 'success' && steps.access.outputs.bypass != 'true'
        uses: pullfrog/pullfrog@c4d0ca6f15d12382ddd20d2010bc596b405f42f0 # v0.1.60
        with:
          prompt: ${{ steps.request.outputs.prompt }}
          timeout: 15m
          push: disabled
          shell: disabled
          progress_comments: disabled
          output_schema: |
            {
              "type": "object",
              "additionalProperties": false,
              "required": ["decision", "reason"],
              "properties": {
                "decision": {
                  "type": "string",
                  "enum": ["keep_open", "close", "needs_human"]
                },
                "reason": {
                  "type": "string",
                  "minLength": 1,
                  "maxLength": 1200
                }
              }
            }

      - name: Apply the PR verdict
        id: verdict
        if: always() && steps.access.outcome == 'success' && steps.access.outputs.bypass != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.pull_request.number }}
          JUDGE_OUTCOME: ${{ steps.judge.outcome }}
          RESULT: ${{ steps.judge.outputs.result }}
        run: nu .github/scripts/contribution-gate.nu pr-verdict
