name: tagpr

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

defaults:
  run:
    shell: bash

jobs:
  tagpr:
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      pull_request: ${{ steps.tagpr.outputs.pull_request }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@047aec4b6c0ce166f52958b5a97f5a3d927fd65b # v1.22.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ci:
    needs: tagpr
    if: needs.tagpr.outputs.tag == '' && needs.tagpr.outputs.pull_request != ''
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ fromJSON(needs.tagpr.outputs.pull_request).head.ref }}
        run: |
          gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"
          gh workflow run check-pr-title.yaml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

  build-native-packages:
    name: ${{ matrix.name }}
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-arm64
            os: blacksmith-32vcpu-ubuntu-2404-arm
            platform: linux
            arch: arm64
            binary: result/bin/ccusage
          - name: build-linux-x64
            os: blacksmith-32vcpu-ubuntu-2404
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-mac-x64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: x64
            binary: result/bin/ccusage
          - name: build-windows-arm64
            os: windows-11-arm
            platform: win32
            arch: arm64
            binary: rust/target/release/ccusage.exe
          - name: build-windows-x64
            os: blacksmith-32vcpu-windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
          save-nix-cache: false
          telemetry-enabled: 'true'
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
          save-nix-cache: false
          telemetry-enabled: 'true'
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          save-cargo-cache: ${{ matrix.arch == 'arm64' }}
          telemetry-enabled: 'true'

  npm:
    needs:
      - tagpr
      - build-native-packages
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: lts/*
          package-manager-cache: false
      - run: nix profile install --inputs-from . .#pnpm .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - name: Publish native packages
        env:
          CCUSAGE_TELEMETRY_ENABLED: 'true'
        run: pnpm --recursive --filter='./packages/ccusage-*' publish --provenance --no-git-checks --access public
      - name: Wait for native package registry availability
        run: .github/scripts/npm-registry-gate.nu
        timeout-minutes: 20
      - name: Publish wrapper
        run: pnpm --recursive --filter='./apps/ccusage' publish --provenance --no-git-checks --access public

  release:
    needs:
      - tagpr
      - npm
    if: needs.tagpr.outputs.tag != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - run: nix run .#changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
