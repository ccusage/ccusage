name: tagpr

on:
  push:
    branches:
      - main
  # Toggling tagpr:minor / tagpr:major labels on the release PR should update
  # its proposed version right away, instead of waiting for the next push to
  # main to make tagpr recompute it.
  pull_request:
    types:
      - labeled
      - unlabeled
  workflow_dispatch:

concurrency: tagpr

jobs:
  tagpr:
    # Label events only matter on tagpr's own release PR; skip the rest so
    # ordinary PR labeling doesn't spend runner time.
    if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'tagpr-from-')
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: read
    outputs:
      tag: ${{ steps.tagpr.outputs.tag }}
      pull_request: ${{ steps.tagpr.outputs.pull_request }}
    steps:
      # persist-credentials stays on (default) so tagpr can push the release PR and tag
      # ref: main because on pull_request events the default checkout is the
      # PR merge ref, while tagpr always operates on the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - id: tagpr
        uses: Songmu/tagpr@1fcd7292d1fe8ea9a8313eef46b8d80b7a15d227 # v1.21.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # pull_request runs on the release PR need approval because
  # github-actions[bot] counts as an external contributor; workflow_dispatch
  # does not.
  ci:
    needs: tagpr
    if: needs.tagpr.outputs.tag == '' && needs.tagpr.outputs.pull_request != ''
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the release branch
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ fromJSON(needs.tagpr.outputs.pull_request).head.ref }}
        run: gh workflow run ci.yaml --repo "$GITHUB_REPOSITORY" --ref "$HEAD_REF"

  # The release jobs below run in this workflow instead of a tag-triggered one
  # because tags pushed with GITHUB_TOKEN do not trigger `on: push: tags`
  # workflows. They run only when tagpr just tagged a release-PR merge, and
  # check out that tag explicitly. To retry a failed release, re-run only the
  # failed jobs: a full re-run finds no new tag and skips everything.
  build-native-packages:
    name: ${{ matrix.name }}
    needs: tagpr
    if: needs.tagpr.outputs.tag != ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-arm64
            os: blacksmith-32vcpu-ubuntu-2404-arm
            platform: linux
            arch: arm64
            binary: result/bin/ccusage
          - name: build-linux-x64
            os: blacksmith-32vcpu-ubuntu-2404
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-mac-x64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: x64
            binary: result/bin/ccusage
          - name: build-windows-arm64
            os: windows-11-arm
            platform: win32
            arch: arm64
            binary: rust/target/release/ccusage.exe
          - name: build-windows-x64
            os: blacksmith-32vcpu-windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          persist-credentials: false
      # Linux mounts the sticky disk CI commits on every push to main. Saving
      # here would only race those commits on Linux, and on macOS the release's
      # own cache entries are evicted long before the next release, while the
      # save delays the npm job.
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
          save-nix-cache: false
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
          save-nix-cache: false
      # CI saves the x64 Cargo cache on pushes to main. Nothing in CI builds
      # Windows arm64, so its leg here is the only writer of its cache; it saves
      # only when the dependency key changes.
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          save-cargo-cache: ${{ matrix.arch == 'arm64' }}

  npm:
    needs:
      - tagpr
      - build-native-packages
    if: needs.tagpr.outputs.tag != ''
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          registry-url: 'https://registry.npmjs.org'
          node-version: lts/*
          package-manager-cache: false
      # node comes from setup-node above (needed for the npm registry auth);
      # Nushell package checks bring Nu through their Nix shebangs. `publint` is
      # the flake's own pinned build, invoked by every package's prepack script.
      - run: nix profile install --inputs-from . .#pnpm .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      # The wrapper must land after its optional native packages: npm installs
      # under a release-age cutoff (--before) silently skip optional deps that
      # are newer than the cutoff, leaving a wrapper without its binary.
      - name: Publish native packages
        run: pnpm --filter='./packages/ccusage-*' publish --provenance --no-git-checks --access public
      - name: Wait for native packages on the registry
        run: |
          version="$(node -p "require('./apps/ccusage/package.json').version")"
          for attempt in $(seq 1 30); do
            missing=()
            for platform in darwin-arm64 darwin-x64 linux-arm64 linux-x64 win32-x64 win32-arm64; do
              package="@ccusage/ccusage-${platform}@${version}"
              if [ "$(npm view "$package" version 2>/dev/null)" != "$version" ]; then
                missing+=("$package")
              fi
            done
            if [ "${#missing[@]}" -eq 0 ]; then
              echo "All native packages for ${version} are available."
              exit 0
            fi
            echo "Attempt ${attempt}: waiting for ${missing[*]}"
            sleep 10
          done
          echo "::error::Native packages are not available on npm: ${missing[*]}"
          exit 1
      - name: Publish ccusage wrapper
        run: pnpm --filter='./apps/ccusage' publish --provenance --no-git-checks --access public

  release:
    needs:
      - tagpr
      - npm
    if: needs.tagpr.outputs.tag != ''
    runs-on: blacksmith-32vcpu-ubuntu-2404
    permissions:
      contents: write
    steps:
      # changelogithub resolves the release tag with `git tag --points-at HEAD`,
      # so checking out the tag is what makes it pick the right release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.tagpr.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
      - run: nix run .#changelogithub
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
