name: Approve Contributor

on:
  issue_comment:
    types:
      - created

defaults:
  run:
    shell: bash

jobs:
  approve:
    if: ${{ !github.event.issue.pull_request }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix-cache

      - name: Update contributor approval
        id: update
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/contribution-gate.nu approve-contributor

      - name: Commit and push
        if: steps.update.outputs.status == 'added' || steps.update.outputs.status == 'updated'
        env:
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/APPROVED_CONTRIBUTORS
          git diff --staged --quiet || git commit -m "chore: approve contributor $ISSUE_AUTHOR"
          git push

      - name: Comment on issue
        if: steps.update.outputs.status == 'added' || steps.update.outputs.status == 'updated' || steps.update.outputs.status == 'already'
        env:
          GH_TOKEN: ${{ github.token }}
          APPROVAL_STATUS: ${{ steps.update.outputs.status }}
          APPROVAL_CAPABILITY: ${{ steps.update.outputs.capability }}
        run: .github/scripts/contribution-gate.nu approve-contributor-comment
