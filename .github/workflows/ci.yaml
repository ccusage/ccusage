name: CI

on:
  push:
    branches: [main, 'tagpr-from-*']
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions: read-all

env:
  PERSIST_CACHES: ${{ github.ref == 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: Detect code changes
    runs-on: blacksmith-2vcpu-ubuntu-2404
    outputs:
      code-changed: ${{ steps.detect.outputs.code-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: detect
        uses: ./.github/actions/detect-code-changes

  tirith-scan:
    name: tirith security scan
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
        with:
          save: ${{ env.PERSIST_CACHES }}
      - name: Install tirith
        run: nix profile install .#tirith
      - name: Scan repository with tirith
        id: scan
        run: |
          set +e
          tirith scan --ci --fail-on high --exclude '*.snap' --format sarif ./ > results.sarif
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          echo "tirith exited ${code}"
      - name: Summarize findings
        if: always()
        run: |
          count="$(jq '[.runs[].results[]?] | length' results.sarif 2>/dev/null || echo 0)"
          echo "tirith reported ${count} finding(s)" | tee -a "$GITHUB_STEP_SUMMARY"
          jq -r '.runs[].results[]? | "- [\(.level // "warning")] \(.ruleId): \(.locations[0].physicalLocation.artifactLocation.uri)"' \
            results.sarif 2>/dev/null | tee -a "$GITHUB_STEP_SUMMARY" || true
      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tirith-sarif
          path: results.sarif
          if-no-files-found: error
      - name: Gate CI on tirith findings
        if: always()
        env:
          SCAN_EXIT: ${{ steps.scan.outputs.exit_code }}
        run: |
          case "$SCAN_EXIT" in
            0 | 2)
              echo "tirith gate passed (exit ${SCAN_EXIT}: no findings, or all below 'high')"
              ;;
            1)
              echo "::error::tirith found findings at or above the 'high' threshold; blocking downstream CI"
              exit 1
              ;;
            *)
              echo "::error::tirith scan errored (exit ${SCAN_EXIT}); blocking downstream CI"
              exit 1
              ;;
          esac

  tirith-sarif-upload:
    name: tirith SARIF upload
    needs: tirith-scan
    if: ${{ always() && !github.event.pull_request.head.repo.fork }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tirith-sarif
      - uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: results.sarif
          category: tirith

  preflight:
    name: security & lint preflight
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
        with:
          save: ${{ env.PERSIST_CACHES }}
      - name: Secret scan, formatting and comments
        run: nix build --print-build-logs .#checks.x86_64-linux.gitleaks .#checks.x86_64-linux.treefmt .#checks.x86_64-linux.comments

  test:
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
        with:
          save: ${{ env.PERSIST_CACHES }}
      - parallel:
          - name: Run nix flake check
            run: nix flake check --print-build-logs
          - name: JS tests and typecheck
            run: |
              nix profile install --inputs-from . .#pnpm .#oxlint nixpkgs#nodejs nixpkgs#just nixpkgs#bun
              just install
              just test-node
              just typecheck
          - name: Babashka performance harness test
            run: nix shell --inputs-from . nixpkgs#just --command just ccusage::test-performance-harness
          - name: Babashka diff-refs test
            run: nix shell --inputs-from . nixpkgs#just --command just ccusage::test-diff-refs
      - name: Root test dependency layers for the sticky disk
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          user_gcroot="/nix/var/nix/gcroots/per-user/$(id -un)/ci"
          mkdir -p "$user_gcroot"
          nix build .#ccusage-tests.passthru.cargoArtifacts \
            --out-link "$user_gcroot/ccusage-test-deps"

  build-native-packages:
    needs: [changes, tirith-scan]
    if: needs.changes.outputs.code-changed == 'true'
    name: ${{ matrix.name }}
    permissions:
      actions: read
      contents: read
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      NIX_CONFIG: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && 'access-tokens =' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: build-linux-arm64
            os: blacksmith-32vcpu-ubuntu-2404-arm
            platform: linux
            arch: arm64
            binary: result/bin/ccusage
          - name: build-linux-x64
            os: blacksmith-32vcpu-ubuntu-2404
            platform: linux
            arch: x64
            binary: result/bin/ccusage
          - name: build-mac-arm64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: arm64
            binary: result/bin/ccusage
          - name: build-mac-x64
            os: blacksmith-12vcpu-macos-26
            platform: darwin
            arch: x64
            binary: result/bin/ccusage
          - name: build-windows-x64
            os: blacksmith-32vcpu-windows-2025
            platform: win32
            arch: x64
            binary: rust/target/release/ccusage.exe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-linux-native-package
        if: matrix.platform == 'linux'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
          save-nix-cache: ${{ env.PERSIST_CACHES }}
      - uses: ./.github/actions/build-macos-nix-native-package
        if: matrix.platform == 'darwin'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          cache-scope: ${{ matrix.name }}
      - uses: ./.github/actions/build-windows-native-package
        if: matrix.platform == 'win32'
        with:
          arch: ${{ matrix.arch }}
          binary: ${{ matrix.binary }}
          save-cargo-cache: ${{ env.PERSIST_CACHES }}

  npm-publish-dry-run-and-upload-pkg-pr-now:
    needs:
      - changes
      - preflight
      - build-native-packages
    if: needs.changes.outputs.code-changed == 'true'
    permissions:
      actions: read
      contents: read
    runs-on: blacksmith-32vcpu-ubuntu-2404
    outputs:
      urls: ${{ steps.publish.outputs.urls }}
      preview-url: ${{ steps.preview-url.outputs.url }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-nix-cache
        with:
          save: ${{ env.PERSIST_CACHES }}
      - run: nix profile install --inputs-from . .#pnpm nixpkgs#nodejs .#publint
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ccusage-native-*
          path: ${{ runner.temp }}/native-packages
          merge-multiple: true
      - name: Restore native package binaries
        run: |
          for archive in "$RUNNER_TEMP"/native-packages/*.tar; do
            tar -xf "$archive"
          done
      - id: publish
        run: pnpm dlx pkg-pr-new@0.0.94 publish --pnpm --bin './apps/ccusage' './packages/ccusage-linux-arm64' './packages/ccusage-linux-x64' './packages/ccusage-darwin-arm64' './packages/ccusage-darwin-x64' './packages/ccusage-win32-x64'
      - id: preview-url
        env:
          URLS: ${{ steps.publish.outputs.urls }}
        run: |
          node <<'JS'
          const urls = (process.env.URLS ?? '').split(/\s+/).filter(Boolean);
          const url = urls.find((value) => /(?:^|\/)ccusage@/.test(value));
          if (url == null) {
            throw new Error(`ccusage preview URL not found in: ${urls.join(', ')}`);
          }
          require('node:fs').appendFileSync(process.env.GITHUB_OUTPUT, `url=${url}\n`);
          JS
      - name: Generate E2E fixture
        run: .github/scripts/generate-e2e-fixture.nu "$RUNNER_TEMP/e2e-fixture"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-e2e-fixture
          path: ${{ runner.temp }}/e2e-fixture
          if-no-files-found: error

  ccusage-preview-e2e:
    if: needs.changes.outputs.code-changed == 'true'
    name: e2e ${{ matrix.runner }} (${{ matrix.os }})
    needs:
      - changes
      - npm-publish-dry-run-and-upload-pkg-pr-now
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CCUSAGE_PREVIEW_URL: ${{ needs.npm-publish-dry-run-and-upload-pkg-pr-now.outputs.preview-url }}
      LOG_LEVEL: '0'
    strategy:
      fail-fast: false
      matrix:
        os:
          - blacksmith-32vcpu-ubuntu-2404
          - blacksmith-32vcpu-ubuntu-2404-arm
          - blacksmith-12vcpu-macos-26
          - macos-15-intel
          - blacksmith-32vcpu-windows-2025
        runner:
          - npm
          - pnpm
          - bun
        exclude:
          # NOTE(2026-11-17, #1293): pnpm dlx on Windows skips the optional native binary in its temporary store. Exclude that leg because the launcher fails with spawn ENOENT.
          - os: blacksmith-32vcpu-windows-2025
            runner: pnpm

    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: matrix.runner == 'pnpm'
        with:
          version: latest
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: matrix.runner == 'bun'
        with:
          bun-version: latest
      - name: Download E2E fixture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # NOTE(2026-06-12, #1297): Blacksmith macOS cold starts returned ECONNREFUSED from the artifact proxy. Download via the GitHub REST API with backoff.
          $dir = "$env:RUNNER_TEMP/e2e-fixture"
          for ($i = 1; $i -le 5; $i++) {
            gh run download $env:GITHUB_RUN_ID --name ccusage-e2e-fixture --dir $dir
            if ($LASTEXITCODE -eq 0) { break }
            if ($i -eq 5) { throw "failed to download the E2E fixture after 5 attempts" }
            Start-Sleep -Seconds ($i * 5)
          }
          "CLAUDE_CONFIG_DIR=$dir" >> $env:GITHUB_ENV
      - name: Run preview E2E
        shell: pwsh
        env:
          RUNNER_KIND: ${{ matrix.runner }}
          # NOTE(2026-06-12, #1293): pnpm's minimumReleaseAge blocks freshly published tarballs (https://pnpm.io/settings#minimumreleaseage). Allow the preview to install immediately.
          PNPM_CONFIG_MINIMUM_RELEASE_AGE: '0'
          # NOTE(2026-06-12, #1293): pnpm's blockExoticSubdeps rejects URL-resolved dependencies (https://pnpm.io/settings#blockexoticsubdeps). Allow the native optional dependencies injected by pkg.pr.new.
          PNPM_CONFIG_BLOCK_EXOTIC_SUBDEPS: 'false'
        run: |
          $url = $env:CCUSAGE_PREVIEW_URL
          function Invoke-Ccusage([string[]]$ccArgs) {
            switch ($env:RUNNER_KIND) {
              'npm' { return (npx --yes $url @ccArgs) }
              'pnpm' { return (pnpm dlx $url @ccArgs) }
              # NOTE(2026-10-15, #1900): bunx rejects a bare URL as the package argument. Use --package and name the binary explicitly.
              'bun' { return (bunx --package $url ccusage @ccArgs) }
            }
          }
          Invoke-Ccusage @('--version') | Out-Host
          if ($LASTEXITCODE -ne 0) { throw '--version failed' }
          foreach ($cmd in 'daily', 'monthly', 'session') {
            foreach ($mode in @(@('--offline'), @())) {
              $label = "$cmd $($mode -join ' ')".Trim()
              Invoke-Ccusage (@($cmd) + $mode) | Out-Host
              if ($LASTEXITCODE -ne 0) { throw "ccusage $label failed ($LASTEXITCODE)" }
              $json = Invoke-Ccusage (@($cmd) + $mode + @('--json'))
              if ($LASTEXITCODE -ne 0) { throw "ccusage $label --json failed ($LASTEXITCODE)" }
              $json | node -e "JSON.parse(require('fs').readFileSync(0, 'utf8'))"
              if ($LASTEXITCODE -ne 0) { throw "ccusage $label --json produced invalid JSON" }
              Write-Host "ok: $label"
            }
          }

  ccusage-perf:
    name: ccusage perf
    if: github.event_name == 'pull_request' && needs.changes.outputs.code-changed == 'true'
    needs: [changes, tirith-scan, preflight]
    permissions:
      actions: read
      contents: read
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 30
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      NIX_CONFIG: 'access-tokens ='

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Nix
        uses: ./.github/actions/setup-nix-cache
        with:
          disk-job: build-native-packages
          cache-scope: build-linux-x64
          save: ${{ env.PERSIST_CACHES }}

      - name: Install perf tooling
        run: nix profile install --inputs-from . nixpkgs#just

      - name: Check that the build sits on the base commit
        run: |
          if ! git merge-base --is-ancestor "$BASE_SHA" HEAD; then
            echo "::error::Base $BASE_SHA is not an ancestor of the checked-out commit $(git rev-parse HEAD)"
            exit 1
          fi

      - name: Build base and PR binaries
        run: |
          nix build .#ccusage-static-no-pgo --out-link "$RUNNER_TEMP/ccusage-head"
          base="git+file://$PWD?rev=$BASE_SHA"
          system="$(nix eval --impure --raw --expr builtins.currentSystem)"
          base_package=ccusage-static-no-pgo
          # NOTE(2026-11-21, #2457): Bases older than the untrained twin only have ccusage-static. That attribute was untrained there, so it is the same comparison.
          if [ "$(nix eval "$base#packages.$system" --apply 'packages: packages ? ccusage-static-no-pgo')" != true ]; then
            base_package=ccusage-static
          fi
          nix build "$base#$base_package" --out-link "$RUNNER_TEMP/ccusage-base"

      - name: Generate benchmark fixtures
        run: just generate-benchmark-fixtures "$RUNNER_TEMP/ccusage-fixtures"

      - name: Compare performance
        run: |
          fixtures="$RUNNER_TEMP/ccusage-fixtures"
          apps/ccusage/scripts/compare-pr-performance.bb \
            --base-bin "$RUNNER_TEMP/ccusage-base/bin/ccusage" \
            --base-sha "$BASE_SHA" \
            --head-bin "$RUNNER_TEMP/ccusage-head/bin/ccusage" \
            --head-sha "$HEAD_SHA" \
            --fixture-dir "$fixtures/large" \
            --codex-fixture-dir "$fixtures/large-codex" \
            --grok-fixture-dir "$fixtures/large-grok" \
            --many-files-fixture-dir "$fixtures/many-files" \
            --proxy-fixture-dir "$fixtures/proxy" \
            --small-fixture-dir "$fixtures/small" \
            --opencode-fixture-dir "$fixtures/opencode" \
            --warmup 2 \
            --runs 11 \
            --output "$RUNNER_TEMP/ccusage-perf-comment.md"

      - name: Write job summary
        run: cat "$RUNNER_TEMP/ccusage-perf-comment.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload comment
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ccusage-perf-comment
          path: ${{ runner.temp }}/ccusage-perf-comment.md
          if-no-files-found: error

  ccusage-perf-comment:
    name: ccusage perf comment
    if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
    needs: ccusage-perf
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write
    runs-on: blacksmith-32vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - name: Checkout base commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup-nix-cache
        with:
          save: ${{ env.PERSIST_CACHES }}

      - name: Download comment
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ccusage-perf-comment
          path: ${{ runner.temp }}/ccusage-perf

      - name: Upsert PR comment
        env:
          COMMENT_FILE: ${{ runner.temp }}/ccusage-perf/ccusage-perf-comment.md
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/scripts/upsert-pr-comment.nu

  action-timeline:
    needs:
      - changes
      - tirith-scan
      - tirith-sarif-upload
      - preflight
      - test
      - build-native-packages
      - npm-publish-dry-run-and-upload-pkg-pr-now
      - ccusage-preview-e2e
      - ccusage-perf
      - ccusage-perf-comment
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: Kesin11/actions-timeline@d547cc51bd6e8016ac50219eeb29a9eb385a2546 # v4.0.0

  ci-gate:
    name: ci gate
    needs:
      - changes
      - tirith-scan
      - tirith-sarif-upload
      - preflight
      - test
      - build-native-packages
      - npm-publish-dry-run-and-upload-pkg-pr-now
      - ccusage-preview-e2e
      - ccusage-perf
      - ccusage-perf-comment
    if: ${{ always() }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Report job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: echo "$RESULTS"
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # NOTE(2026-11-10, #2062): Dispatch check runs do not attach to the release PR. Post a commit status on the same SHA to satisfy the required ci gate.
  release-dispatch-status-pending:
    name: release dispatch status (pending)
    if: (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref_name, 'tagpr-from-')
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post pending commit status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context='ci gate' \
            -f description='CI is running' \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  release-dispatch-status:
    name: release dispatch status
    needs:
      - release-dispatch-status-pending
      - ci-gate
    if: ${{ always() && (github.event_name == 'workflow_dispatch' || github.event_name == 'push') && startsWith(github.ref_name, 'tagpr-from-') }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    permissions:
      statuses: write
    steps:
      - name: Post final commit status
        env:
          GH_TOKEN: ${{ github.token }}
          GATE_RESULT: ${{ needs.ci-gate.result }}
        run: |
          if [ "$GATE_RESULT" = success ]; then
            state=success
            description='All CI jobs passed'
          else
            state=failure
            description="ci gate: $GATE_RESULT"
          fi
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='ci gate' \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
